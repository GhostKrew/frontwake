<body>

<style>
/* Layout: one-screen sea chart — thin command bars top and bottom, the map fills the rest. Single deliberate dark look. */
:root{
  --sea:#0b1f2e; --panel:#0f2738; --line:#1e4458;
  --ink:#e6eef0; --muted:#86a0ab; --gold:#f2c14e; --danger:#e8705a;
  --f-display:"Saira Condensed","Arial Narrow",system-ui,sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:dark;
}
[hidden]{display:none!important}
html,body{height:100%}
body{background:var(--sea);color:var(--ink);font-family:var(--f-display);font-size:16px;overflow:hidden}
#app{height:100%;display:flex;flex-direction:column}
.bar{display:flex;align-items:center;gap:16px;flex-wrap:wrap;background:var(--panel);border-color:var(--line);border-style:solid;border-width:0;
  padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header.bar{border-bottom-width:1px}
footer.bar{border-top-width:1px}
.bbar{flex:1 1 100%;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;min-width:0;scrollbar-width:thin}
.bslot{position:relative;flex:none;display:flex;align-items:center;gap:6px;padding:4px 8px 4px 4px;border:1px solid var(--line);border-radius:5px;background:var(--sea);cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;text-transform:none;letter-spacing:0;font-weight:500}
.bslot canvas{width:26px;height:26px;flex:none}
.bslot .bn{display:flex;flex-direction:column;align-items:flex-start;line-height:1.05}
.bslot .bn b{font-family:var(--f-data);font-size:14px;font-variant-numeric:tabular-nums}
.bslot .bn small{font-family:var(--f-data);font-size:10px;color:var(--muted)}
.bslot .bn em{font-style:normal;color:var(--gold)}
.bslot.poor .bn small{color:var(--danger)}
.bslot:active{cursor:grabbing}
#dragGhost{position:fixed;z-index:20;pointer-events:none;width:34px;height:34px;margin:-17px 0 0 -17px;opacity:.9}
.tbar{flex:1 1 100%;display:flex;flex-direction:column;gap:4px;min-width:0}
.tlabels{display:flex;justify-content:space-between;gap:12px;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.tlabels b{font-family:var(--f-data);font-size:13px;letter-spacing:0;color:var(--ink);font-variant-numeric:tabular-nums}
.tlabels .tfight b{color:var(--danger)}
.track{position:relative;height:10px;border-radius:5px;background:var(--sea);border:1px solid var(--line);overflow:hidden;display:flex}
.track i{display:block;height:100%;transition:width .25s linear}
.track .home{background:var(--gold)}
.track .fight{background:repeating-linear-gradient(135deg,var(--danger) 0 5px,color-mix(in srgb,var(--danger) 55%,transparent) 5px 9px)}
.brand{font-weight:800;font-size:22px;letter-spacing:.06em;text-transform:uppercase}
.brand span{color:var(--gold)}
#exitBtn{padding:4px 12px;font-size:14px;background:transparent;border-color:var(--line);color:var(--ink)}
#exitBtn:hover{border-color:var(--danger);color:var(--danger);filter:none}
#modeTag{font-family:var(--f-data);font-size:11px;color:var(--muted);border:1px solid var(--line);border-radius:3px;padding:2px 6px;letter-spacing:.06em}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-left:auto}
.stat{display:flex;flex-direction:column;line-height:1.1}
.stat small{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.stat b{font-family:var(--f-data);font-size:15px;font-variant-numeric:tabular-nums}
.stat.gold b{color:var(--gold)}
.bmenu{position:absolute;z-index:6;user-select:none;-webkit-user-select:none;width:270px;max-width:calc(100% - 16px);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px;display:flex;flex-direction:column;gap:4px;box-shadow:0 10px 30px rgba(0,0,0,.45)}
.bhead{display:flex;justify-content:space-between;align-items:baseline;padding:4px 6px 6px;border-bottom:1px solid var(--line);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.bhead b{font-family:var(--f-data);color:var(--gold);letter-spacing:0;font-size:14px}
.bnote{margin:2px 6px;font-size:13px;color:var(--danger)}
.bmenu button.upg{border-color:var(--gold);background:color-mix(in srgb,var(--gold) 10%,transparent)}
.bmenu button{display:flex;align-items:center;gap:10px;text-align:left;text-transform:none;letter-spacing:0;font-weight:500;padding:6px 8px;border-color:transparent;background:transparent}
.bmenu button:not(:disabled):hover,.bmenu button:focus-visible{background:var(--sea);border-color:var(--line);filter:none}
.bmenu canvas{flex:none;width:28px;height:28px}
.bt{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.2}
.bt b{font-size:16px}.bt small{font-size:12px;color:var(--muted)}
.bp{font-family:var(--f-data);font-size:13px;color:var(--gold)}
.bmenu button:disabled .bp{color:var(--danger)}
#stage{flex:1;position:relative;min-height:0}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;cursor:crosshair}
.zoom{position:absolute;top:12px;right:max(12px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;align-items:stretch;gap:4px;z-index:2}
.zoom button{padding:4px 0;width:40px;font-size:18px;line-height:1.2;background:var(--panel)}
.zoom button#zfit{font-size:12px;padding:6px 0}
.zoom span{font-family:var(--f-data);font-size:11px;text-align:center;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:2px 0}
.send{display:flex;align-items:center;gap:10px;flex:1 1 220px;min-width:0}
.send label{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.send label b{font-family:var(--f-data);color:var(--gold);font-size:14px;letter-spacing:0;display:inline-block;width:4ch;text-align:right}
#ratio{flex:1;min-width:0;accent-color:var(--gold)}
#board{list-style:none;margin:0;padding:0;display:flex;gap:12px;flex-wrap:wrap;font-family:var(--f-data);font-size:12px;font-variant-numeric:tabular-nums}
#board li{display:flex;align-items:center;gap:5px;white-space:nowrap}
#board i{width:10px;height:10px;border-radius:2px;display:inline-block}
#board li.me{color:var(--gold)}
.credit{position:absolute;right:max(14px,env(safe-area-inset-right,0px));bottom:14px;z-index:6;display:flex;flex-direction:column;align-items:flex-end;gap:1px;text-align:right}
.credit span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.credit a{font-weight:800;font-size:20px;letter-spacing:.04em;color:var(--gold);text-decoration:none;border-bottom:2px solid transparent}
.credit a:hover,.credit a:focus-visible{border-bottom-color:var(--gold)}
.credit-in{display:none}
@media (max-width:520px){.credit:not(.credit-in){display:none!important}.credit-in{display:flex;position:static;align-items:center;justify-content:center;flex-direction:column;padding-top:4px}}
.tutp{position:absolute;top:12px;left:50%;transform:translateX(-50%);z-index:4;width:min(380px,calc(100% - 140px));background:var(--panel);border:1px solid var(--gold);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
@media (min-width:521px){#stage:has(#tut:not([hidden])) #toast{top:auto;bottom:64px}}
.tutp b{font-size:18px;letter-spacing:.02em}
.tutp p{margin:0;color:var(--muted);font-size:15px;line-height:1.35}
.tutp .row{gap:8px}.tutp button{padding:4px 10px;font-size:13px}
.tuthead{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.tutbar{height:4px;border-radius:2px;background:var(--sea);overflow:hidden}.tutbar i{display:block;height:100%;background:var(--gold)}
@media (max-width:520px){.tutp{left:12px;right:12px;width:auto;transform:none;top:auto;bottom:12px}}
@keyframes tutglow{0%,100%{box-shadow:0 0 0 0 rgba(242,193,78,.0)}50%{box-shadow:0 0 0 4px rgba(242,193,78,.55)}}
.tutpulse{animation:tutglow 1.4s ease-in-out infinite;border-radius:6px}
@media (prefers-reduced-motion:reduce){.tutpulse{animation:none;outline:2px solid var(--gold)}}
.reqs{position:absolute;bottom:12px;left:max(12px,env(safe-area-inset-left,0px));z-index:3;display:flex;flex-direction:column;gap:6px;max-width:min(300px,calc(100% - 24px))}
.req{background:var(--panel);border:1px solid var(--gold);border-radius:6px;padding:8px 10px;display:flex;flex-direction:column;gap:6px;font-size:15px}
.req .row{gap:6px}.req button{padding:4px 10px;font-size:14px}
.dip{display:flex;flex-wrap:wrap;gap:6px;padding:4px 6px 8px;border-bottom:1px solid var(--line)}
.dip button{padding:5px 10px;font-size:14px;text-transform:none;letter-spacing:0;background:var(--sea)}
.dip button.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 50%,var(--line))}
.bnote.ok{color:var(--muted)}
#board li.ally{color:#9fd8a8}
.fronts{position:absolute;top:12px;left:max(12px,env(safe-area-inset-left,0px));z-index:2;background:color-mix(in srgb,var(--panel) 92%,transparent);border:1px solid var(--line);border-radius:6px;padding:8px 10px;min-width:180px;max-width:min(260px,calc(100% - 90px));display:flex;flex-direction:column;gap:3px;pointer-events:none}
.fronts h4{margin:0 0 2px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fronts .row2{display:flex;justify-content:space-between;gap:10px;font-size:14px;line-height:1.3}
.fronts .row2 span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.fronts .row2 b{font-family:var(--f-data);font-size:13px;font-variant-numeric:tabular-nums;color:var(--gold)}
.fronts .row2.in b,.fronts .row2.in span{color:var(--danger)}
#tip{position:absolute;pointer-events:none;background:var(--panel);border:1px solid var(--line);padding:4px 8px;font-family:var(--f-data);font-size:12px;border-radius:4px;white-space:nowrap}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--danger);color:var(--ink);padding:6px 12px;border-radius:4px;font-size:15px;max-width:calc(100% - 32px);text-align:center;z-index:5}
#banner{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);background:var(--gold);color:#1b1404;padding:6px 14px;border-radius:4px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;font-size:15px;white-space:nowrap}
#overlay{position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--sea) 62%,transparent);padding:16px;overflow-y:auto}
.card{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:24px;max-width:440px;width:100%;display:flex;flex-direction:column;gap:14px}
.idbar{display:flex;gap:10px;align-items:center}
.idbar input{flex:1;min-width:0}
.cdot{width:40px;height:40px;flex:none;border-radius:50%;padding:0;border:3px solid var(--ink);box-shadow:0 0 0 2px var(--line)}
.cdot:hover,.cdot[aria-expanded=true]{border-color:var(--gold);filter:none}
.cpop{border:1px solid var(--line);border-radius:6px;background:var(--sea);padding:12px;display:flex;flex-direction:column;gap:10px}
.cpop[hidden]{display:none!important}
.sw{display:grid;grid-template-columns:repeat(8,1fr);gap:6px}
.sw button{aspect-ratio:1;border-radius:50%;padding:0;border:2px solid transparent;min-width:0}
.sw button[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 2px var(--gold)}
.wheelrow{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
#cwheel{width:150px;height:150px;border-radius:50%;cursor:crosshair;touch-action:none;flex:none}
.wheelside{display:flex;flex-direction:column;gap:8px;flex:1;min-width:120px}
.wheelside label{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
#cval{width:100%;accent-color:var(--gold)}
#chex{font-family:var(--f-data);width:100%}
.titlebar{display:flex;align-items:center;gap:12px}
.backarrow{width:40px;height:40px;flex:none;display:grid;place-items:center;padding:0;border-radius:50%;background:transparent;border-color:var(--line);color:var(--ink)}
.backarrow:hover,.backarrow:focus-visible{border-color:var(--gold);color:var(--gold);filter:none}
.card h1{margin:0;font-size:44px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;line-height:1;text-wrap:balance}
.card h1 span{color:var(--gold)}
.card h2{margin:0;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card p{margin:0;line-height:1.45;color:var(--muted);font-size:17px}
.card ul.how{margin:0;padding-left:18px;color:var(--ink);line-height:1.5;font-size:16px}
#stage:has(#overlay:not([hidden])) .zoom{display:none}
.tutbtn{width:100%;background:transparent;border-style:dashed;color:var(--ink)}
.tutstep{font-size:12px!important;letter-spacing:.14em;text-transform:uppercase;color:var(--gold)!important;font-weight:700}
.tuticons{display:flex;flex-wrap:wrap;gap:10px}
.tuticons figure{margin:0;display:flex;flex-direction:column;align-items:center;gap:2px;width:68px}
.tuticons canvas{width:36px;height:36px}
.tuticons figcaption{font-size:12px;color:var(--muted);text-align:center;line-height:1.15}
.tutdots{display:flex;gap:6px;justify-content:center}
.tutdots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.tutdots i.on{background:var(--gold)}
.modes{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:520px){.modes{grid-template-columns:1fr}}
.bval{font-family:var(--f-data);color:var(--gold);font-size:14px;letter-spacing:0;margin-left:6px}
input[type=range]#bots{width:100%;accent-color:var(--gold)}
.diffs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.diff{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;text-transform:none;letter-spacing:0;font-weight:500;padding:8px 10px}
.diff b{font-size:16px;text-transform:uppercase;letter-spacing:.05em}
.diff span{font-size:12px;color:var(--muted);line-height:1.25}
.diff[aria-checked=true]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.diff[aria-checked=true] b{color:var(--gold)}
@media (max-width:420px){.diffs{grid-template-columns:1fr}}
.ticks{display:flex;justify-content:space-between;font-family:var(--f-data);font-size:10px;color:var(--muted)}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;padding:14px;text-transform:none;letter-spacing:0}
.mode b{font-size:24px;text-transform:uppercase;letter-spacing:.05em}
.mode span{font-weight:500;font-size:14px;color:var(--muted)}
.mode.solo b{color:var(--gold)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.row > input{flex:1;min-width:0}
.field{display:flex;flex-direction:column;gap:6px}
label.k{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.list li{display:flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:4px;padding:8px 10px;background:var(--sea)}
.list li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list li .meta{font-family:var(--f-data);font-size:12px;color:var(--muted)}
.list li.empty{color:var(--muted);border-style:dashed;background:transparent}
.list li i{width:12px;height:12px;border-radius:2px;flex:none}
.code{font-family:var(--f-data);color:var(--gold);letter-spacing:.04em}
.note{font-size:14px;color:var(--muted)}
input[type=text],select,button{font:inherit;font-size:16px;border-radius:4px;border:1px solid var(--line);background:var(--sea);color:var(--ink);padding:8px 12px}
button{cursor:pointer;font-weight:700;letter-spacing:.05em;text-transform:uppercase}
button.primary{background:var(--gold);border-color:var(--gold);color:#1b1404}
button.link{background:transparent;border-color:transparent;color:var(--muted);padding:4px 0;align-self:flex-start}
button:disabled{opacity:.45;cursor:not-allowed}
button:not(:disabled):hover{filter:brightness(1.12)}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mapgroups{display:flex;flex-direction:column;gap:6px}
.mapgroups h3{margin:4px 0 0;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:600}
.maps{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.map{display:flex;flex-direction:column;align-items:stretch;gap:3px;padding:6px;text-align:left;text-transform:none;letter-spacing:0;font-weight:500}
.map .pic{aspect-ratio:100/62;max-width:100%;border-radius:3px;background:var(--sea) center/cover;image-rendering:pixelated;display:grid;place-items:center;font-size:28px;font-weight:800;color:var(--muted)}
.map .pic.rnd{background:repeating-linear-gradient(135deg,var(--sea) 0 8px,var(--line) 8px 10px)}
.map b{font-size:15px;letter-spacing:.03em}
.map span{font-size:12px;color:var(--muted);line-height:1.25}
.map[aria-checked=true]{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.map[aria-checked=true] b{color:var(--gold)}
.card{max-height:calc(100% - 8px);overflow-y:auto}
@media (max-width:520px){.stats{margin-left:0;gap:12px}.card h1{font-size:36px}.card{padding:18px}}

/* ---------- menu polish ---------- */
#app:has(#overlay:not([hidden])) header .stats,#app:has(#overlay:not([hidden])) footer .send,#app:has(#overlay:not([hidden])) footer #board{display:none}
#overlay{background:radial-gradient(ellipse at 50% 40%,color-mix(in srgb,var(--sea) 35%,transparent),color-mix(in srgb,var(--sea) 82%,transparent) 75%);backdrop-filter:blur(1.5px)}
.card{max-width:480px;border-radius:14px;border-color:color-mix(in srgb,var(--line) 80%,var(--ink) 8%);
  background:linear-gradient(180deg,color-mix(in srgb,var(--panel) 92%,#fff 4%),var(--panel) 120px);
  box-shadow:0 24px 60px -18px rgba(0,0,0,.65),0 0 0 1px rgba(255,255,255,.03) inset;animation:cardIn .28s cubic-bezier(.2,.8,.2,1)}
@keyframes cardIn{from{opacity:0;transform:translateY(10px) scale(.985)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.card{animation:none}.mode,.map,.cdot,.backarrow{transition:none!important}}
button,input[type=text]{transition:border-color .15s,background-color .15s,color .15s,box-shadow .15s,transform .15s}
input[type=text]{border-radius:8px}input[type=text]:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 22%,transparent)}
button{border-radius:8px}
button.primary{box-shadow:0 6px 18px -8px color-mix(in srgb,var(--gold) 80%,transparent)}
button.primary:not(:disabled):hover{transform:translateY(-1px)}
/* identity strip */
.idbar{background:var(--sea);border:1px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px}
.idbar .who{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);white-space:nowrap}
.idbar input{border:0;background:transparent;padding:6px 4px;font-weight:600}
.idbar input:focus{box-shadow:none}
.idbar:focus-within{border-color:var(--gold)}
.cpop{border-radius:12px}
/* title area */
.hero{display:flex;flex-direction:column;gap:6px;padding:4px 0 2px}
.hero .tag{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);font-weight:700}
/* mode cards */
.mode{position:relative;gap:6px;padding:16px 14px;border-radius:12px;background:linear-gradient(180deg,color-mix(in srgb,var(--sea) 70%,var(--panel)),var(--sea))}
.mode svg{width:28px;height:28px;color:var(--muted);margin-bottom:2px}
.mode:not(:disabled):hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--gold) 60%,var(--line));filter:none;box-shadow:0 10px 24px -14px rgba(0,0,0,.8)}
.mode:not(:disabled):hover svg{color:var(--gold)}
.mode.solo{border-color:color-mix(in srgb,var(--gold) 55%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--gold) 12%,var(--sea)),var(--sea))}
.mode.solo svg{color:var(--gold)}
/* how to play, folded */
details.howto{border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--sea) 60%,transparent)}
details.howto summary{cursor:pointer;list-style:none;padding:12px 14px;font-weight:700;font-size:14px;letter-spacing:.1em;text-transform:uppercase;display:flex;justify-content:space-between;align-items:center}
details.howto summary::-webkit-details-marker{display:none}
details.howto summary::after{content:'';width:8px;height:8px;border-right:2px solid var(--muted);border-bottom:2px solid var(--muted);transform:rotate(45deg) translateY(-2px);transition:transform .2s}
details.howto[open] summary::after{transform:rotate(-135deg) translateY(-2px)}
details.howto ul.how{padding:0 16px 14px 32px;font-size:15px;color:var(--muted)}
details.howto ul.how li+li{margin-top:6px}
.menurow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.menurow button{width:100%}
.tutbtn{border-style:solid;background:var(--sea)}
/* maps */
.map{border-radius:10px}
.map .pic{border-radius:6px}
.map:not(:disabled):hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--gold) 50%,var(--line));filter:none}
.card h1{letter-spacing:.03em}

label.chk{display:flex;gap:12px;align-items:flex-start;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--sea);cursor:pointer}
label.chk input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--gold);flex:none}
label.chk span{display:flex;flex-direction:column;gap:2px}
label.chk b{font-size:15px}label.chk small{font-size:13px;color:var(--muted);line-height:1.35}
label.chk:has(input:focus-visible){outline:2px solid var(--gold);outline-offset:2px}
.list li button.kick{padding:4px 10px;font-size:12px;border-radius:6px;color:var(--danger);border-color:color-mix(in srgb,var(--danger) 50%,var(--line));background:transparent}
.list li button.kick:hover{background:color-mix(in srgb,var(--danger) 15%,transparent)}
@media (max-width:520px){
  .mode{display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;column-gap:14px;row-gap:0;align-items:center;padding:12px 14px}
  .mode svg{grid-row:1/3;margin:0}
  .mode b{font-size:20px}
  .menurow{grid-template-columns:1fr}
  .card h1{font-size:38px}
  .idbar .who{display:none}
}
.titlebar h1{font-size:40px}

// ---------- tick ----------
function runTick(){
  simTick++;
  const list=pending.get(simTick);if(list){for(const [n,t,r,k] of list)applyInput(n,t,r,k|0);pending.delete(simTick)}
  recount();
  for(const n of nat){if(!n.alive)continue;const m=cap(n);const bm=n.bot?DF():null;if(n.troops<m)n.troops+=(1+n.tiles*.012+n.e[3]*1.5)*(1-n.troops/m)*(bm?bm.regen:1)*(n.mega?2.2:1);
    n.gold+=(1+n.tiles*.005+n.e[1]*.3+n.e[2]*.8+n.e[15]*3+n.e[18]*.4)*(bm?bm.gold:1)*(n.mega?2.2:1)}
  for(const n of nat)if(n.alive&&n.bot)botThink(n);
  attacks=attacks.filter(stepAttack);
  if(simTick%CREEP_EVERY===0)creep();
  stepShips();
  stepTrade();
  stepAir();
  stepRigs();
  stepRails();
  stepRepairs();
  stepBoats();
  stepMissiles();
  for(const n of nat)if(n.alive&&n.tiles===0)kill(n.id);
  if(simTick%50===0)recordChecksum();

  tickAt=performance.now();qStart=qh;qEnd=dlist.length;
  checkEnd();
}

  if(playOn){if(!nat[P].alive&&!shownDead){shownDead=true;if(mode==='solo')return end(false,'Your last province fell.');showDead()}return}
  if(nat[P].alive&&alive.length>1&&alive.every(n=>n.id===P||allied(P,n.id)))return end(true,null,true);
  const top=alive.find(n=>n.tiles/totalLand>=.7)||(alive.length===1?alive[0]:null);
  if(top)return end(top.id===P,top.id===P?null:`${top.name} now holds most of the world.`);
  if(!nat[P].alive&&!shownDead){shownDead=true;
    if(mode==='solo')return end(false,"Your last province fell.");
    showDead()}
}

async function joinGame(code){

function onGamePeers(ch){
  const peers=ch.peers;const me=peers.find(p=>p.sameTab);if(me)myPeer=me.peer;
  if(mode==='host'){
    if(H_.phase==='lobby'){
      const others=peers.filter(p=>!p.sameTab&&p.kind==='viewer'&&typeof p.presence?.n==='string'&&!p.presence.g&&!H_.kicked.includes(p.peer))
        .sort((a,b)=>a.peer<b.peer?-1:1).slice(0,7);
      H_.players=[{p:myPeer||'host',n:nick,c:myColor},...others.map(p=>({p:p.peer,n:String(p.presence.n).slice(0,16),c:COLOR_OK.test(p.presence.c||'')?p.presence.c:''}))];
      announce({code:H_.code,n:nick,c:H_.players.length});
      publishHost();renderRoomLobby();
    }else{
      for(const p of peers){const idx=H_.players.findIndex(x=>x.p===p.peer);if(idx<1||H_.kicked.includes(p.peer))continue;
        const acts=p.presence?.acts;if(!Array.isArray(acts))continue;
        for(const a of acts){if(!Array.isArray(a))continue;const [s,tile,r,kk]=a;const k=Number.isInteger(kk)&&((kk>=0&&kk<=19)||(kk>=20&&kk<=26))?kk:0;
          if(!Number.isInteger(s)||s<=(H_.lastSeq[p.peer]||0))continue;H_.lastSeq[p.peer]=s;
          if(Number.isInteger(tile)&&tile>=0&&tile<N&&Number.isFinite(r))schedule(idx,tile,Math.max(5,Math.min(100,Math.round(r))),k)}}
    }
    return;
  }
  if(mode==='client'){
    const h=peers.find(p=>p.presence&&typeof p.presence.g==='object'&&p.presence.g);
    if(peers.some(p=>!p.sameTab&&p.presence&&p.presence.bye)){if(hostPeer)hostGone();return}
    if(!h){if(hostPeer&&!hostLostAt){hostLostAt=Date.now();toast('Connection to the host dropped. Reconnecting…');clearTimeout(hostLostTm);
        hostLostTm=setTimeout(()=>{if(hostLostAt&&mode==='client'){hostLostAt=0;hostGone(true)}},HOST_GRACE)}return}
    if(hostLostAt){hostLostAt=0;clearTimeout(hostLostTm);toast('Reconnected to the host.')}
    hostPeer=h.peer;const g=h.presence.g;
    if(Array.isArray(g.kick)&&myPeer&&g.kick.includes(myPeer)){const c=clientCode;leaveOnline();try{sessionStorage.setItem('fw-kicked-'+c,'1')}catch{}showMenu();toast('The host kicked you from the game.');return}
    if(g.phase==='lobby'){if(screen==='waiting'||screen==='roomlobby')renderRoomLobbyClient(g)}
    else if(g.phase==='play'){
      if(phase!=='play'&&phase!=='over'){
        const idx=Array.isArray(g.players)?g.players.findIndex(x=>x.p===myPeer):-1;
        if(idx<0){leaveOnline();showMenu();return toast("That game already started without you.")}
        diff=[0,1,2].includes(g.diff)?g.diff:1;realCountries=!!g.rc;
        startOnline(g.seed|0,mapById(g.type).id==='random'?'pangaea':mapById(g.type).id,g.players.map(x=>({n:String(x.n).slice(0,16),c:String(x.c||'')})),Math.max(0,Math.min(400,g.bots|0)),idx);
      }
      if(g.more&&phase==='over'&&!playOn){resumeOver();toast('The host kept the match going.')}
      if(g.more)playOn=true;
      if(Array.isArray(g.log))for(const e of g.log){if(Array.isArray(e)&&e[0]>maxSeenId){maxSeenId=e[0];addPending(e[1],e[2],e[3],e[4],e[5])}}
      if(Number.isInteger(g.tick))hostTick=Math.max(hostTick,g.tick);
      if(Array.isArray(g.ck)&&ckLocal.has(g.ck[0])&&ckLocal.get(g.ck[0])!==g.ck[1]&&!desynced){desynced=true;toast("Your map drifted out of sync with the host. Rejoin if things look off.")}
    }
  }
}

   'Buildings take a few seconds to finish. Right-click a building to upgrade it, up to level 5. Factories earn gold and lay railroads to nearby buildings, even across borders, and every train trip pays. Cities raise your troop cap, Markets earn gold, Barracks speed up troop regrowth, and Forts make nearby land costly to attack.']},
 {t:'Ports, airports and oil',icons:[8,12,15],p:['Ports and airports send trade ships and planes to other ports and airports, and each trip pays gold.',
   'Oil rigs go on the sea near your land. They pay a lot of gold but take 90 seconds to build, and an enemy warship nearby can seize one.']},
 {t:'Navy and air force',icons:[9,6,10,13],p:['Right-click the sea to build warships. You need a finished port, and the ship sails from it to the spot you picked.',
   'Gunboats are fast and cheap, Frigates are all-rounders, and Battleships hit hardest from far away. Fighters from your airport shoot down enemy planes.']},
 {t:'Bombs',icons:[5,14,7,11,17],p:['A Missile Silo lets you launch an Atom Bomb, a far bigger Hydrogen Bomb, or a MIRV that splits into 12 warheads across a whole realm. Bombed land becomes nuclear wasteland: anyone can take it, but nothing can be built there until its owner pays 40,000 gold to repair it. Everything in the blast is wiped out.',
   'With an airport, a Bomber Strike flattens buildings and troops in a smaller area without taking land.']},
 {t:'Alliances and trading',icons:[],p:['Right-click another realm to propose an alliance. Allies can’t attack each other, defend each other, and earn 50% more from trade together.',
   'Right-click an ally to send them gold or troops, or to break the alliance. Bots remember who attacked them, so pick your fights carefully.']},
 {t:'Playing with friends',icons:[],p:['Choose Host on the main menu to open a lobby and get a short code. Friends choose Join and pick your game or type the code.',
   'The host picks the map, the difficulty and how many bots join. You’re ready. Good luck!']}];
function showTutorial(i){screen='tutorial';const T=TUT[i];
  showCard(`<p class="tutstep">Step ${i+1} of ${TUT.length}</p><h1>${T.t}</h1>
  ${T.icons.length?`<div class="tuticons" id="tutIcons"></div>`:''}
  ${T.p.map(x=>`<p>${x}</p>`).join('')}
  <div class="tutdots" aria-hidden="true">${TUT.map((_,k)=>`<i class="${k===i?'on':''}"></i>`).join('')}</div>
  <div class="row"><button id="tBack" ${i===0?'disabled':''}>Back</button>${i<TUT.length-1?'<button class="primary" id="tNext">Next</button>':'<button class="primary" id="tPlay">Play Solo</button>'}</div>
  <button class="link" id="tMenu">← Main menu</button>`);
  if(T.icons.length){const box=$('tutIcons');for(const k of T.icons){const fig=document.createElement('figure');const c=document.createElement('canvas');c.width=c.height=72;const g=c.getContext('2d');g.scale(2,2);
    g.fillStyle=isBomb(k)||k===14?'#e8705a':'#f2c14e';g.strokeStyle='#08141e';g.lineWidth=2;drawIcon(g,k,18,18,24);const cap=document.createElement('figcaption');cap.textContent=KINDS[k].name;fig.append(c,cap);box.append(fig)}}
  if(i>0)$('tBack').onclick=()=>showTutorial(i-1);
  if($('tNext'))$('tNext').onclick=()=>showTutorial(i+1);if($('tPlay'))$('tPlay').onclick=showSolo;$('tMenu').onclick=showMenu;
  ($('tNext')||$('tPlay')).focus()}
function showSolo(){
  screen='solo';mode='solo';previewMap(selectedMap);P=0;
  showCard(`<div class="titlebar"><button type="button" class="backarrow" id="backTop" aria-label="Back to main menu" title="Main menu"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h1>Solo</h1></div><p>Pick a map and how many rival realms share it, then choose where to land.</p>
  <div class="field"><h2>Map</h2><div id="maplist"></div></div>
  <button id="newmap" ${selectedMap==='random'?'':'hidden'}>Reroll map</button>
  ${diffPicker()}
  ${botSlider(1,'Rivals')}
  ${realToggle()}
  <p class="note" id="botwarn" hidden>Hundreds of rivals make a crowded, chaotic map and can run slowly on older phones.</p>
  <button class="primary" id="go">Choose landing</button>
  <button class="link" id="back">← Main menu</button>`);
  $('maplist').append(mapList(selectedMap,id=>{selectedMap=id;previewMap(id);$('newmap').hidden=id!=='random'}));
  $('newmap').onclick=()=>previewMap('random');
  const warn=()=>$('botwarn').hidden=botCount<150;wireBots(warn);warn();
  $('back').onclick=showMenu;$('backTop').onclick=showMenu;
  wireDiff();wireReal();
  $('go').onclick=()=>{try{window.fwTrack&&fwTrack('start_match',{mode:'solo',map:selectedMap,bots:botCount})}catch{}for(let b=0;b<botCount;b++)addBot(b);maybeMiroslaw();placeRest(P);shownDead=false;$('banner').textContent='Rivals have landed. Tap open land to pick your spot · drag to pan';
    $('overlay').hidden=true;phase='spawn';screen='game';$('banner').hidden=false;$('exitBtn').hidden=false;$('modeTag').hidden=false;$('modeTag').textContent='SOLO · '+DF().name.toUpperCase()};
}
function showOnline(){screen='online';renderOnline()}
function roomNote(){return roomState==='pending'?`<p class="note">Connecting…</p>`:roomState==='none'?`<p class="note">Online play couldn't start here. Check your internet connection and reload the page.</p>`:''}
function showHost(){screen='host';renderHost()}
function renderHost(){
  if(screen!=='host')return;const ok=roomState==='ok';
  showCard(`<div class="titlebar"><button type="button" class="backarrow" id="backTop" aria-label="Back to main menu" title="Main menu"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h1>Host</h1></div><p>Open a lobby, then pick the map and bots while friends join.</p>
  <div class="field"><label class="k" for="nick">Your name</label><input type="text" id="nick" maxlength="16" value="${esc(nick)}"></div>
  ${roomNote()}
  <button class="primary" id="host" ${ok?'':'disabled'}>Open lobby</button>
  <button class="link" id="back">← Main menu</button>`);
  $('nick').onchange=e=>saveNick(e.target.value);
  $('host').onclick=()=>{saveNick($('nick').value);hostGame()};$('back').onclick=showMenu;$('backTop').onclick=showMenu}
function renderOnline(){
  if(screen!=='online')return;
  const ok=roomState==='ok';
  showCard(`<div class="titlebar"><button type="button" class="backarrow" id="backTop" aria-label="Back to main menu" title="Main menu"><svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></button><h1>Join</h1></div>
  <div class="field"><label class="k" for="nick">Your name</label><input type="text" id="nick" maxlength="16" value="${esc(nick)}"></div>
  ${roomNote()}
  <div class="field"><h2>Open games</h2><ul class="list" id="games"></ul></div>
  <div class="field"><label class="k" for="code">Join with a code</label>
  <div class="row"><input type="text" id="code" maxlength="8" placeholder="e.g. k7qm2" autocomplete="off"><button id="joincode" ${ok?'':'disabled'}>Join</button></div></div>
  <button class="link" id="back">← Main menu</button>`);
  $('nick').onchange=e=>saveNick(e.target.value);
  $('joincode').onclick=()=>{saveNick($('nick').value);joinGame($('code').value)};
  $('code').onkeydown=e=>{if(e.key==='Enter')$('joincode').click()};
  $('back').onclick=showMenu;$('backTop').onclick=showMenu;
  renderGames();
}
function renderGames(){
  const ul=$('games');if(!ul)return;ul.innerHTML='';
  if(net==='fb'){watchLobby();const now=Date.now(),list=Object.entries(fbLobby).filter(([c,v])=>v&&typeof v.n==='string'&&now-(+v.at||0)<10*60*1000).slice(0,8);
    if(!list.length){const li=document.createElement('li');li.className='empty';li.textContent='No open games right now. Ask a friend for their code, or host your own.';ul.append(li);return}
    for(const [c,v] of list){const li=document.createElement('li');const nm=document.createElement('span');nm.className='nm';nm.textContent=String(v.n).slice(0,16)+"'s game";
      const meta=document.createElement('span');meta.className='meta';meta.textContent=(v.c|0)+'/8';const b=document.createElement('button');b.textContent='Join';
      b.onclick=()=>{saveNick($('nick').value);joinGame(String(c))};li.append(nm,meta,b);ul.append(li)}return}
  if(net!=='claude'){const li=document.createElement('li');li.className='empty';li.textContent='Ask the host for their game code and enter it below.';ul.append(li);return}
  const hosts=roomApi?roomApi.peers().filter(p=>!p.sameTab&&p.presence?.host&&typeof p.presence.host.code==='string'):[];
  if(!hosts.length){const li=document.createElement('li');li.className='empty';li.textContent='No open games right now. Ask a friend for their code, or host your own.';ul.append(li);return}
  for(const h of hosts.slice(0,8)){const g=h.presence.host;const li=document.createElement('li');
    const nm=document.createElement('span');nm.className='nm';nm.textContent=(String(g.n||'Someone').slice(0,16))+"'s game";
    const meta=document.createElement('span');meta.className='meta';meta.textContent=(g.c|0)+'/8';
    const b=document.createElement('button');b.textContent='Join';b.onclick=()=>{saveNick($('nick').value);joinGame(String(g.code))};
    li.append(nm,meta,b);ul.append(li)}
}
function playerList(players,hostLabel){
  const ul=document.createElement('ul');ul.className='list';
  players.forEach((p,k)=>{const li=document.createElement('li');const i=document.createElement('i');i.style.background=COLOR_OK.test(p.c||'')?p.c:`rgb(${HUMAN[k%HUMAN.length]})`;
    const nm=document.createElement('span');nm.className='nm';nm.textContent=String(p.n).slice(0,16)+(p.p===myPeer||(k===0&&mode==='host')?' (you)':'');
    const meta=document.createElement('span');meta.className='meta';meta.textContent=k===0?hostLabel:'';li.append(i,nm,meta);
    if(mode==='host'&&k>0){const kb=document.createElement('button');kb.type='button';kb.className='kick';kb.textContent='Kick';kb.setAttribute('aria-label','Kick '+String(p.n).slice(0,16));kb.onclick=()=>kickPlayer(p.p);li.append(kb)}
    ul.append(li)});
  return ul}
function renderRoomLobby(){
  if(mode!=='host'||H_.phase!=='lobby')return;screen='roomlobby';
  showCard(`<h1>Game <span class="code">${esc(H_.code)}</span></h1>
  <p>Friends tap Join on the main menu and enter this code${net==='claude'||net==='fb'?' (or pick your game from the list)':''}.</p>
  <div class="field"><h2>Players · ${H_.players.length}/8</h2><div id="plist"></div></div>
  <div class="field"><h2>Map</h2><div id="maplist"></div></div>
  ${diffPicker()}
  ${botSlider(0,'Bot realms')}
  ${realToggle()}
  <button class="primary" id="start">Start match</button>
  <button class="link" id="leave">← Leave</button>`);
  $('plist').append(playerList(H_.players,'host'));
  $('maplist').append(mapList(H_.map,id=>{H_.map=id;selectedMap=id;previewMap(id);publishHost()}));
  wireDiff(publishHost);wireReal(publishHost);
  let bt=0;wireBots(()=>{H_.bots=botCount;clearTimeout(bt);bt=setTimeout(publishHost,250)});H_.bots=botCount;
  $('start').onclick=()=>{if(H_.players.length+botCount<2)return toast("Add a bot or wait for a friend.");hostStart()};
  $('leave').onclick=showMenu;
}
function renderWaiting(code){screen='waiting';
  showCard(`<h1>Game <span class="code">${esc(code)}</span></h1><p>Looking for the host…</p><button class="link" id="leave">← Leave</button>`);$('leave').onclick=showMenu}
function renderRoomLobbyClient(g){
  screen='roomlobby';const players=Array.isArray(g.players)?g.players:[];
  showCard(`<h1>Game <span class="code">${esc(clientCode)}</span></h1>
  <p>Waiting for the host to start. Map: ${esc(mapById(g.map).name)}. Difficulty: ${DIFFS[[0,1,2].includes(g.diff)?g.diff:1].name}. Bot realms: ${Math.max(0,g.bots|0)}.</p>
  <div class="field"><h2>Players · ${players.length}/8</h2><div id="plist"></div></div>
  <button class="link" id="leave">← Leave</button>`);
  $('plist').append(playerList(players,'host'));$('leave').onclick=showMenu;
}
function showDead(){
  showCard(`<h1><span style="color:var(--danger)">Defeated</span></h1><p>Your realm fell, but the match goes on. You can keep watching.</p>
  <div class="row"><button class="primary" id="watch">Keep watching</button><button id="toMenu">Leave match</button></div>`);
  $('watch').onclick=()=>$('overlay').hidden=true;$('toMenu').onclick=showMenu;
}
function end(won,why,byAlliance){
  const canMore=!!nat[P]?.alive&&((mode==='solo'&&won)||mode==='host');
  if(mode==='solo')running=false;
  phase='over';const me=nat[P];
  if(mode==='host'){running=false;publishHost()}
  if(mode==='client')running=false;
  showCard(`<h1>${won?'Victory':'<span style="color:var(--danger)">Defeated</span>'}</h1>
  <p>${won?(byAlliance?`Every realm left standing is your ally. Your alliance rules the world after ${Math.round(simTick/10)} seconds.`:`You hold ${(me.tiles/totalLand*100).toFixed(0)}% of the world after ${Math.round(simTick/10)} seconds.`):esc(why)}</p>
  ${canMore?`<button class="primary" id="more">Keep playing</button><p class="note">${mode==='host'?'Everyone in the match keeps going. ':''}The map stays as it is and the match won't end again until you leave.</p>`:''}
  ${mode==='client'&&!playOn?'<p class="note">The host can choose to keep the match going.</p>':''}
  <div class="row">${mode==='solo'?`<button class="${canMore?'':'primary'}" id="again">Play again</button>`:''}<button id="toMenu" class="${mode==='solo'||canMore?'':'primary'}">Main menu</button></div>`);
  if($('again'))$('again').onclick=showSolo;$('toMenu').onclick=showMenu;
  if($('more'))$('more').onclick=keepPlaying;
}
function keepPlaying(){if(phase!=='over')return;playOn=true;resumeOver();
  if(mode==='host'){H_.more=1;publishHost()}
  toast('Playing on. Grab the rest of the world!')}
function resumeOver(){playOn=true;phase='play';running=true;$('overlay').hidden=true;screen='game'}

// ---------- loop ----------
new ResizeObserver(resize).observe(cv);resize();
previewMap(selectedMap);showMenu();
let last=performance.now(),acc=0;
function frame(now){
  acc+=Math.min(500,now-last);last=now;
  if(mode==='client'){acc=0;if(running){let k=0;while(simTick<hostTick&&k<30&&running){runTick();k++}}}
  else{let ran=false;while(acc>=100){acc-=100;if(running){runTick();ran=true}}if(ran&&mode==='host')publishHost()}
  draw();requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script>
